name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Matches production so canonical links and the sitemap are built and checked.
      VITE_SITE_URL: https://olympus-green.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check-results/
          if-no-files-found: ignore
