acing="2">THE LISTENING ROOM</text><text x="90" y="1322" font-size="28">Choose a record. Return it to its sleeve.</text><text x="90" y="1380" font-size="19" letter-spacing="2">THIS EVENING</text><text x="90" y="1417" font-size="28">Ask your host what is on the turntable</text><text x="90" y="1515" font-size="18">OLYMPUS / FICTIONAL IDENTITY STUDY / 2026</text></g><path d="M90 154H1110M90 1135H1110M90 1450H1110" stroke="#f4f1ea" stroke-width="1" opacity=".4"/></svg>