<!doctype html>
<html lang="en">

<title>Out of reach — OLYMPUS</title>
<link rel="icon" href="/pwa/favicon-32.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #080808; color: #f4f1ea; }
  body {
    min-height: 100dvh; display: grid; place-items: center;
    padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
    font: 400 1rem/1.5 Archivo, 'Helvetica Neue', Arial, sans-serif; text-align: center;
  }
  main { max-width: 28rem; }
  svg { width: 5.5rem; height: auto; margin: 0 auto 2rem; display: block; }
  .label { font: 500 0.6875rem/1 ui-monospace, Menlo, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #8f8a80; }
  h1 { margin: 1rem 0; font-size: clamp(2.25rem, 10vw, 3.5rem); line-height: 0.95; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
  p { color: #cfc8b9; }
  button {
    margin-top: 2rem; min-height: 48px; padding: 0 1.75rem; border: 1px solid #d4af37; border-radius: 999px;
    background: transparent; color: #f4f1ea; font: 500 0.875rem/1 inherit; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  button:active { background: #d4af37; color: #080808; }
  button:focus-visible { outline: 2px solid #d4af37; outline-offset: 3px; }
</style>
</head>

<main>

  <p class="label">Signal lost</p>
  <h1>Olympus is out of reach.</h1>
  <p>Even Hermes needs a connection. Pages you have already opened are still here; this one needs the network.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
